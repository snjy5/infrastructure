name: Production Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible & Molecule
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible python3-pip
          pip3 install "molecule-plugins[docker]" ansible-lint

      - name: Install Ansible Dependencies
        run: ansible-galaxy install -r ansible/requirements.yml

      - name: Execute Master Orchestrator
        env:
          VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          if [ -z "$VAULT_PASSWORD" ]; then
            echo "::error::VAULT_PASSWORD secret is empty or missing!"
            exit 1
          fi

          ansible-playbook \
            -i ansible/inventory/local.ini \
            -i ansible/inventory/production.ini \
            --vault-password-file <(echo "$VAULT_PASSWORD") \
            ansible/playbooks/ci.yml
