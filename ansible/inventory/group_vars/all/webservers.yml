# ansible/inventory/group_vars/webservers.yml

# ---------------------------------------------------------
# FIREWALL (UFW)
# ---------------------------------------------------------
security_firewall_enabled: true
security_firewall_state: "enabled" # enabled | disabled
security_firewall_logging: "low"   # off | low | medium | high | full

security_firewall_allowed_tcp_ports:
  - "22"
  - "80"
  - "443"
security_firewall_allowed_udp_ports:
  - "51820" # Wireguard
security_firewall_default_incoming: "deny"
security_firewall_default_outgoing: "allow"

# Optional: Allow specific subnets/IPs to bypass restrictions (e.g., WireGuard, internal)
security_firewall_allow_from: []
# Example:
# - { ip: "10.0.0.0/8", port: "8080", proto: "tcp" }

# ---------------------------------------------------------
#  SSH HARDENING
# ---------------------------------------------------------
security_ssh_port: 22
security_ssh_permit_root_login: "no"
security_ssh_password_authentication: "no"
security_ssh_pubkey_authentication: "yes"
security_ssh_x11_forwarding: "no"
security_ssh_max_auth_tries: 3
security_ssh_client_alive_interval: 300
security_ssh_client_alive_count_max: 2
security_ssh_allow_users: "admin" # e.g., "admin deploy" (empty = allow all valid users)

# ---------------------------------------------------------
# FAIL2BAN (Lenient & Safe)
# ---------------------------------------------------------
security_fail2ban_enabled: true
security_fail2ban_bantime: "1h"
security_fail2ban_findtime: "10m"
security_fail2ban_maxretry: 5

# Add your CI runner, office IP, or monitoring tools here so you never lock yourself out.
security_fail2ban_ignoreip:
  - "127.0.0.1/8"
  - "::1"

# Jails to enable
security_fail2ban_jails:
  - sshd

# ---------------------------------------------------------
# UNATTENDED UPGRADES
# ---------------------------------------------------------
security_autoupdate_enabled: true
security_autoupdate_reboot: false
security_autoupdate_reboot_time: "03:00"
security_autoupdate_mail_to: "" # Leave empty to disable mail

# geerlingguy.docker
docker_install_compose_plugin: true

# Custom App Variables
app_base_dir: /opt/app
website_repo_url: https://github.com/snjy5/website.git
website_repo_branch: master

gitea_image_tag: "1.21.11"
gitea_port: 3000
website_port: 8090
docker_network_name: "infrastructure_net"

gitea_data_dir: "{{ app_base_dir }}/data/gitea"
gitea_container_name: "gitea"
website_container_name: "website"
website_build_context: "{{ app_base_dir }}/website-src"

# Nginx / SSL Role Variables
admin_email: "{{ vault_admin_email }}"
webroot_path: "/var/www/certbot"
cert_min_days: 30
nginx_ssl_protocols: "TLSv1.2 TLSv1.3"
nginx_ssl_ciphers: "HIGH:!aNULL:!MD5"

gitea_uid:  "USER_UID=1000"
gitea_gid: "USER_GID=1000"
gitea_db_type: "GITEA__database__DB_TYPE=sqlite3"
gitea_install_lock: "GITEA__security__INSTALL_LOCK=true"

# Application config (used by reverse-proxy.conf.j2 template)
main_domain: "{{ vault_main_domain }}"

# gitea install setup
gitea_admin_username: "{{ vault_gitea_admin_username }}"
gitea_admin_password: "{{ vault_gitea_admin_password }}"
gitea_admin_email: "{{ vault_admin_email }}"

# handle root & sub domain
services:
  - name: website
    hostnames:
      - "{{ main_domain }}"
      - "www.{{ main_domain }}"
    port: "{{ website_port }}"

  - name: gitea
    hostnames:
      - "gitea.{{ main_domain }}"
    port: "{{ gitea_port }}"

# Extract all hostnames from all services into one list, and remove duplicates
all_domains: "{{ services | map(attribute='hostnames') | flatten | unique }}"
