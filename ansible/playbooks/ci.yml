---
- name: Install Ansible Galaxy dependencies
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Install collections and roles from requirements.yml
      command:
        cmd: ansible-galaxy install -r requirements.yml
        chdir: "{{ playbook_dir }}/.."   # ← Change to project root
      changed_when: false

- import_playbook: orchestrate.yml
