---
# Play 1: Install Galaxy dependencies
- name: Install Ansible Galaxy dependencies
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Install collections and roles from requirements.yml
      command:
        cmd: ansible-galaxy install -r "{{ playbook_dir }}/../requirements.yml"
      changed_when: false
      register: galaxy_install

# Play 2: Run the real orchestration playbook
- import_playbook: orchestrate.yml
