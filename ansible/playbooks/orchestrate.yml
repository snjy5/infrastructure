---
# STAGE 1: Local Orchestration & Infrastructure Provisioning
- name: Provision Infrastructure
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../inventory/group_vars/all/vault.yml

  tasks:
    - name: Ensure .ssh directory exists on the CI runner
      file:
        path: ~/.ssh
        state: directory
        mode: '0700'

    - name: Write SSH Private Key from Vault to disk
      copy:
        content: "{{ vault_ssh_private_key }}"
        dest: ~/.ssh/id_ed25519_deploy
        mode: '0600'

    - name: Extract Public Key from Private Key for Terraform
      shell:
        cmd: ssh-keygen -y -f ~/.ssh/id_ed25519_deploy > ~/.ssh/id_ed25519_deploy.pub
      changed_when: false

    - name: Provision Infrastructure with Terraform
      community.general.terraform:
        project_path: "{{ playbook_dir }}/../../terraform"
        state: present
        force_init: true
      environment:
        AWS_ACCESS_KEY_ID: "{{ vault_aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ vault_aws_secret_access_key }}"
      register: terraform_result

    - name: Get Terraform outputs (server_public_ip)
      shell:
        cmd: |
          cd "{{ playbook_dir }}/../../terraform"
          terraform output -raw server_public_ip 2>/dev/null || echo ""
      register: tf_output
      changed_when: false

    - name: Debug - Show Terraform output
      debug:
        msg: "Server IP: {{ tf_output.stdout }}"
      when: tf_output.stdout != ""

    - name: Add host to webservers group dynamically
      add_host:
        name: "{{ tf_output.stdout }}"
        groups: webservers
        ansible_user: admin
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_deploy
        ansible_python_interpreter: /usr/bin/python3
      when: tf_output.stdout != ""

    - name: Fail if no IP address found
      fail:
        msg: "No server IP address found from Terraform output!"
      when: tf_output.stdout == ""

# STAGE 2: Server Configuration & App Deployment
- import_playbook: playbook.yml
