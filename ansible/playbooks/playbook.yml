---
- name: Apply baseline and security hardening
  hosts: all
  become: true
  roles:
    - common
    - security
    - firewall

- name: Deploy core runtime and networking
  hosts: all
  become: true
  roles:
    - docker
    - wireguard

- name: Deploy application workloads and proxy
  hosts: all
  become: true
  roles:
    - gitea
    - nginx
