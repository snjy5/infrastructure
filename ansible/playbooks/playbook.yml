# Master playbook that applies all infrastructure configuration
---
- name: Apply common configuration to all hosts
  hosts: all
  become: true
  roles:
    - common
    - firewall

- name: Configure web servers
  hosts: all
  become: true
  roles:
    - nginx

- name: Configure database servers
  hosts: all
  become: true
  roles:
    - mysql

- name: Deploy VPN
  hosts: all
  become: true
  roles:
    - wireguard

- name: Configure docker
  hosts: all
  become: true
  roles:
    - docker

- name: Deploy git server
  hosts: all
  become: true
  roles:
    - gitea
