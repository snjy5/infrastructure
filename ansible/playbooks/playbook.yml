#
# This playbook configures a base server for running containerized applications.
# Its only jobs are to harden the OS, install Docker, and set up Nginx
# as a reverse proxy.
#
# It should be run once after the server is provisioned by Terraform.
#
- hosts: all
  become: true # Most of these tasks require root privileges

  vars:
    # --- Centralized Configuration ---
    # Define your domain here once.
    # In a real project, this would be stored in `ansible/inventory/group_vars/all/vars.yml`
    # or passed in as an extra-var by the CI/CD pipeline.
    main_domain: "yourdomain.com"

    # A list of service definitions. This makes adding new services clean and easy.
    # We will manage these services with a docker-compose.yml file.
    # The Nginx role will use this list to automatically create reverse proxy configs.
    services:
      - name: gitea
        port: 3000
      - name: newapp
        port: 8080
      # Add future services here, e.g.:
      # - name: another-app
      #   port: 9001

  roles:
    # --- Base System Configuration ---
    - role: common    # User accounts, packages, timezone, etc.
    - role: security  # Basic security hardening (e.g., fail2ban)
    - role: firewall  # Manages firewall rules (e.g., ufw)
    - role: geerlingguy.docker    # Installs Docker and Docker Compose

    # --- Reverse Proxy Configuration ---
    - role: geerlingguy.nginx
      vars:
        nginx_remove_default_vhost: true
        # This built-in loop automatically builds the config for every app in your 'services' list!
        nginx_vhosts: >-
          {% set vhosts = [] %}
          {% for app in services %}
          {%   set _ = vhosts.append({
                 'listen': '80',
                 'server_name': app.name ~ '.' ~ main_domain,
                 'proxy_pass': 'http://127.0.0.1:' ~ app.port,
                 'proxy_set_headers': [
                   'Host $host',
                   'X-Real-IP $remote_addr',
                   'X-Forwarded-For $proxy_add_x_forwarded_for',
                   'X-Forwarded-Proto $scheme'
                 ]
               })
          %}
          {% endfor %}
          {{ vhosts }}

  # Setup docker compose
  tasks:
    - name: Ensure application directory exists on server
      ansible.builtin.file:
        path: /opt/app
        state: directory
        mode: '0755'

    - name: Copy docker-compose.yml to server
      ansible.builtin.copy:
        # playbook_dir is ansible/playbooks, so we go up two levels to the root
        src: "{{ playbook_dir }}/../../docker-compose.yml" 
        dest: /opt/app/docker-compose.yml
        mode: '0644'

    - name: Deploy applications via Docker Compose
      community.docker.docker_compose_v2:
        project_src: /opt/app
        state: present
        remove_orphans: true
