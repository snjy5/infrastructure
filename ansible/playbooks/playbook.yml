---
# SERVER CONFIGURATION & DEPLOYMENT PLAYBOOK
# Configures the target server with Docker, Nginx, and starts apps.

- name: Configure Server and Deploy Applications
  hosts: webservers
  become: true
  vars_files:
    - ../inventory/group_vars/all/vault.yml

  roles:
    - role: common
    - role: geerlingguy.firewall
    - role: geerlingguy.security
    - role: geerlingguy.docker
    - role: nginx

  tasks:
    - name: Ensure application directory exists on server
      ansible.builtin.file:
        path: /opt/app
        state: directory
        mode: '0755'

    - name: Copy docker-compose.yml to server
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker-compose.yml"
        dest: /opt/app/docker-compose.yml
        mode: '0644'

    - name: Create .env file for Docker Compose secrets
      ansible.builtin.copy:
        content: |
          GITEA_DB_PASSWORD={{ vault_gitea_db_password }}
          MYSQL_ROOT_PASSWORD={{ vault_mysql_root_password }}
        dest: /opt/app/.env
        mode: '0600'
      no_log: true

    - name: Deploy applications via Docker Compose
      community.docker.docker_compose_v2:
        project_src: /opt/app
        state: present
        remove_orphans: true
        env_files:
          - /opt/app/.env
