# ansible/roles/common/tasks/main.yml

- name: Set /etc/hosts from template
  ansible.builtin.template:
    src: templates/hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Remove broken Docker APT sources to prevent apt update failures
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/sources.list.d/download_docker_com_linux_debian.list
    - /etc/apt/sources.list.d/archive_uri-https_download_docker_com_linux_debian-bookworm.list
  become: true

- name: Install essential packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - vim
      - htop
      - net-tools
      - unzip
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Check if swap file already exists
  ansible.builtin.stat:
    path: /swapfile
  register: swap_file_check

- name: Create swap file
  ansible.builtin.command:
    cmd: fallocate -l 1G /swapfile
  when: not swap_file_check.stat.exists
  become: true

- name: Set swap file permissions
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: '0600'
  become: true

- name: Format swap file
  ansible.builtin.command:
    cmd: mkswap /swapfile
  when: not swap_file_check.stat.exists
  become: true

- name: Enable swap file
  ansible.builtin.command:
    cmd: swapon /swapfile
  when: not swap_file_check.stat.exists
  become: true

- name: Persist swap file in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: '/swapfile none swap sw 0 0'
    state: present
  become: true

- name: Set swappiness (prefer RAM, use swap only under real pressure)
  ansible.posix.sysctl:
    name: vm.swappiness
    value: '10'
    state: present
    reload: true
  become: true
