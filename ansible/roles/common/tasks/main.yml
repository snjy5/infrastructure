# ansible/roles/common/tasks/main.yml

- name: Set /etc/hosts from template
  ansible.builtin.template:
    src: templates/hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Remove broken Docker APT sources to prevent apt update failures
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/sources.list.d/download_docker_com_linux_debian.list
    - /etc/apt/sources.list.d/archive_uri-https_download_docker_com_linux_debian-bookworm.list
  become: true

- name: Install essential packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - vim
      - htop
      - net-tools
      - unzip
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

# add to ansible/roles/common/tasks/main.yml
- name: Deploy reverse proxy vhost config
  ansible.builtin.template:
    src: templates/reverse-proxy.conf.j2
    dest: /etc/nginx/conf.d/reverse-proxy.conf
    mode: '0644'
  become: true
  notify: reload nginx
