---
# roles/common_handlers/handlers/main.yml
- name: Test Nginx configuration
  ansible.builtin.command: nginx -t
  become: true
  listen: "Reload Nginx"
  changed_when: false

- name: Reload Nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
  become: true
  listen: "Reload Nginx"
