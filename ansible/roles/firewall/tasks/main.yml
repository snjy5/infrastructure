---
- name: Install UFW package
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow essential ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop: "{{ firewall_allowed_ports }}"

- name: Enable UFW and set default deny policy
  community.general.ufw:
    state: enabled
    default: deny
