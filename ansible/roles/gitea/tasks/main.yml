---
- name: Ensure Gitea data volume directory exists
  ansible.builtin.file:
    path: /opt/gitea_data
    state: directory
    owner: 1000
    group: 1000
    mode: '0755'

- name: Deploy Gitea container via Docker Compose
  community.docker.docker_compose_v2:
    project_name: gitea
    definition:
      services:
        gitea:
          image: gitea/gitea:latest
          container_name: gitea
          environment:
            - USER_UID=1000
            - USER_GID=1000
          restart: always
          ports:
            - "127.0.0.1:3000:3000"
            - "127.0.0.1:222:22"
          volumes:
            - /opt/gitea_data:/data
    state: present
