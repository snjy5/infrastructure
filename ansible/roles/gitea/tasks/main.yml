---
- name: Ensure Gitea data volume directory exists with correct permissions
  ansible.builtin.file:
    path: /opt/gitea_data
    state: directory
    owner: 1000
    group: 1000
    mode: '0755'

- name: Deploy and manage Gitea container with Docker Compose
  community.docker.docker_compose:
    project_name: gitea
    definition:
      version: '3'
      services:
        gitea:
          image: gitea/gitea:latest
          container_name: gitea
          environment:
            - USER_UID=1000
            - USER_GID=1000
          restart: always
          ports:
            - "3000:3000"
            - "222:22"
          volumes:
            - /opt/gitea_data:/data
    state: present
    recreate: always
