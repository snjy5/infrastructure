- name: Deploy selected Nginx site configuration
  ansible.builtin.template:
    src: "{{ service_type }}.conf.j2"
    dest: "/etc/nginx/conf.d/{{ service_type }}_site.conf"
    owner: root
    group: root
    mode: '0644'
    
- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded