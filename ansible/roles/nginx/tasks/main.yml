# ---------------------------------------------------------
# 2. INSTALLATION & BASE SETUP
# ---------------------------------------------------------
- name: Install Nginx and Certbot
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
    state: present
    update_cache: yes
    cache_valid_time: 3600
  become: true

- name: Remove default Nginx vhosts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/conf.d/default.conf
  become: true

- name: Ensure webroot directory exists for HTTP-01 challenge
  ansible.builtin.file:
    path: "{{ webroot_path }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  become: true

- name: Validate Nginx configuration before starting
  ansible.builtin.command: nginx -t
  changed_when: false
  become: true

# ---------------------------------------------------------
# 3. START NGINX (Required BEFORE Certbot runs)
# ---------------------------------------------------------
# Force a real restart rather than trusting the package
# postinst's auto-start, which can report "active" before
# the socket is actually bound on a fresh install.
- name: Ensure Nginx is enabled and (re)started
  ansible.builtin.systemd:
    name: nginx
    state: restarted
    enabled: true
    daemon_reload: true
  become: true

- name: Give Nginx a moment to bind its sockets
  ansible.builtin.pause:
    seconds: 2

# ---------------------------------------------------------
# 4. PRE-FLIGHT CHECK (Port 80 availability)
# ---------------------------------------------------------
- name: Check if Port 80 is open and listening
  ansible.builtin.wait_for:
    port: 80
    host: "127.0.0.1"
    timeout: 10
    state: started
  register: port_80_check
  ignore_errors: yes

- name: Fail if Port 80 is not available for HTTP-01 challenge
  block:
    - name: Capture nginx service status for diagnosis
      ansible.builtin.command: systemctl status nginx --no-pager
      register: nginx_status_dump
      changed_when: false
      ignore_errors: yes

    - name: Fail with actual nginx status attached
      ansible.builtin.fail:
        msg: >
          FATAL: Port 80 is not listening. Let's Encrypt HTTP-01 challenge
          requires port 80 to be open. nginx status:
          {{ nginx_status_dump.stdout }}
  when: port_80_check is failed
