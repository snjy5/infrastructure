# ansible/roles/nginx/tasks/main.yml

- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Remove default nginx vhost
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/conf.d/default.conf
  become: true
  notify: reload nginx

- name: Ensure nginx is enabled and started
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  become: true

- name: Deploy reverse proxy vhost config
  ansible.builtin.template:
    src: templates/reverse-proxy.conf.j2
    dest: /etc/nginx/conf.d/reverse-proxy.conf
    mode: '0644'
  become: true
  notify: reload nginx
