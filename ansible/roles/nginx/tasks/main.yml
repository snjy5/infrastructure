# ansible/roles/nginx/tasks/main.yml
---
# ---------------------------------------------------------
# 1. VALIDATION (Fail fast if misconfigured)
# ---------------------------------------------------------
- name: Validate required variables are provided
  ansible.builtin.assert:
    that:
      - main_domain is defined and main_domain | length > 0
      - services is defined and services | length > 0
      - admin_email is defined and admin_email | length > 0
      - webroot_path is defined
      - cert_min_days is defined
    fail_msg: "Required variables (main_domain, services, admin_email, webroot_path, cert_min_days) must be defined."

# ---------------------------------------------------------
# 2. INSTALLATION & BASE SETUP
# ---------------------------------------------------------
- name: Install Nginx and Certbot
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
    state: present
    update_cache: yes
    cache_valid_time: 3600
  become: true

- name: Remove default Nginx vhosts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/conf.d/default.conf
  become: true
  notify: Reload Nginx

- name: Ensure webroot directory exists for HTTP-01 challenge
  ansible.builtin.file:
    path: "{{ webroot_path }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  become: true

# ---------------------------------------------------------
# 3. START NGINX (Required BEFORE Certbot runs)
# ---------------------------------------------------------
- name: Ensure Nginx is enabled and started
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  become: true

# ---------------------------------------------------------
# 4. PRE-FLIGHT CHECK (Port 80 availability)
# ---------------------------------------------------------
- name: Check if Port 80 is open and listening
  ansible.builtin.wait_for:
    port: 80
    host: "127.0.0.1"
    timeout: 3
    state: started
  register: port_80_check
  ignore_errors: yes

- name: Fail if Port 80 is not available for HTTP-01 challenge
  ansible.builtin.fail:
    msg: >
      FATAL: Port 80 is not listening. Let's Encrypt HTTP-01 challenge
      requires port 80 to be open. Check firewalls or conflicting services.
  when: port_80_check is failed

# ---------------------------------------------------------
# 5. CERTIFICATES (one per service, under main_domain)
# ---------------------------------------------------------
- name: Check and Generate SSL Certificates for all services
  ansible.builtin.include_tasks: manage_cert.yml
  loop: "{{ services }}"
  loop_control:
    label: "{{ item.name }}.{{ main_domain }}"

# ---------------------------------------------------------
# 6. DEPLOY NGINX CONFIG (AFTER certs exist)
# ---------------------------------------------------------
- name: Deploy Nginx reverse proxy configuration
  ansible.builtin.template:
    src: reverse-proxy.conf.j2
    dest: "/etc/nginx/sites-available/{{ main_domain }}"
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload Nginx

- name: Enable Nginx site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ main_domain }}"
    dest: "/etc/nginx/sites-enabled/{{ main_domain }}"
    state: link
  become: true
  notify: Reload Nginx

# ---------------------------------------------------------
# 7. BACKGROUND RENEWAL
# ---------------------------------------------------------
- name: Ensure Certbot systemd timer is enabled and running
  ansible.builtin.systemd:
    name: certbot.timer
    enabled: yes
    state: started
  become: true
