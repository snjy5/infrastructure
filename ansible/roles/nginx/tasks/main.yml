# ansible/roles/nginx/tasks/main.yml
---
# ---------------------------------------------------------
# 1. VALIDATION (Fail fast if misconfigured)
# ---------------------------------------------------------
- name: Validate required variables are provided
  ansible.builtin.assert:
    that:
      - main_domain is defined and main_domain | length > 0
      - services is defined and services | length > 0
      - admin_email is defined and admin_email | length > 0
      - webroot_path is defined
      - cert_min_days is defined
    fail_msg: "Required variables (main_domain, services, admin_email, webroot_path, cert_min_days) must be defined."

# ---------------------------------------------------------
# 2. INSTALLATION & BASE SETUP
# ---------------------------------------------------------
- name: Install Nginx and Certbot
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
    state: present
    update_cache: yes
    cache_valid_time: 3600
  become: true

- name: Remove default Nginx vhosts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/conf.d/default.conf
  become: true

- name: Remove legacy manually-created vhosts from conf.d
  ansible.builtin.file:
    path: /etc/nginx/conf.d/reverse-proxy.conf
    state: absent
  become: true

- name: Ensure webroot directory exists for HTTP-01 challenge
  ansible.builtin.file:
    path: "{{ webroot_path }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  become: true

# ---------------------------------------------------------
# 3. BOOTSTRAP (Only if cert doesn't exist yet)
# ---------------------------------------------------------
- name: Check if SSL certificate already exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ san_domains[0] }}/fullchain.pem"
  register: ssl_cert_stat

- name: Deploy temporary ACME-challenge-only vhost
  ansible.builtin.template:
    src: acme-challenge.conf.j2
    dest: "/etc/nginx/sites-available/{{ main_domain }}"
    owner: root
    group: root
    mode: '0644'
  become: true
  when: not ssl_cert_stat.stat.exists  # <--- CRITICAL FIX

- name: Enable Nginx site (bootstrap config)
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ main_domain }}"
    dest: "/etc/nginx/sites-enabled/{{ main_domain }}"
    state: link
  become: true
  when: not ssl_cert_stat.stat.exists

- name: Validate Nginx configuration before starting
  ansible.builtin.command: nginx -t
  changed_when: false
  become: true

- name: Ensure Nginx is enabled and (re)started
  ansible.builtin.systemd:
    name: nginx
    state: restarted
    enabled: true
    daemon_reload: true
  become: true
  when: not ssl_cert_stat.stat.exists

# ---------------------------------------------------------
# 4. PRE-FLIGHT CHECK (Port 80 availability)
# ---------------------------------------------------------
- name: Check if Port 80 is open and listening
  ansible.builtin.wait_for:
    port: 80
    host: "127.0.0.1"
    timeout: 10
    state: started
  register: port_80_check
  ignore_errors: yes

- name: Fail if Port 80 is not available for HTTP-01 challenge
  block:
    - name: Capture nginx service status for diagnosis
      ansible.builtin.command: systemctl status nginx --no-pager
      register: nginx_status_dump
      changed_when: false
      ignore_errors: yes

    - name: Fail with actual nginx status attached
      ansible.builtin.fail:
        msg: >
          FATAL: Port 80 is not listening. Let's Encrypt HTTP-01 challenge
          requires port 80 to be open. nginx status:
          {{ nginx_status_dump.stdout }}
  when: port_80_check is failed

# ---------------------------------------------------------
# 5. CERTIFICATE
# ---------------------------------------------------------
- name: Check and Generate SAN SSL Certificate
  ansible.builtin.include_tasks: manage_cert.yml
  when: not (skip_ssl_provisioning | default(false) | bool)

# ---------------------------------------------------------
# 6. DEPLOY FINAL NGINX CONFIG
# ---------------------------------------------------------
- name: Deploy Nginx reverse proxy configuration
  ansible.builtin.template:
    src: reverse-proxy.conf.j2
    dest: "/etc/nginx/sites-available/{{ main_domain }}"
    owner: root
    group: root
    mode: '0644'
  become: true
  register: final_nginx_conf
  when: not (skip_ssl_provisioning | default(false) | bool)

- name: Enable Nginx site (final config)
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ main_domain }}"
    dest: "/etc/nginx/sites-enabled/{{ main_domain }}"
    state: link
  become: true
  when: not (skip_ssl_provisioning | default(false) | bool)

# Validate BEFORE restarting so we don't kill Nginx if Jinja made a typo
- name: Validate final Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
  become: true
  when: final_nginx_conf is changed

- name: Restart Nginx to apply final config
  ansible.builtin.systemd:
    name: nginx
    state: restarted
  become: true
  when: final_nginx_conf is changed
