# ansible/roles/nginx/tasks/manage_cert.yml
---
- name: Check if SSL certificate is present and valid
  community.crypto.x509_certificate_info:
    path: "/etc/letsencrypt/live/{{ san_domains[0] }}/fullchain.pem"
  register: cert_info
  ignore_errors: yes

- name: Determine if certificate needs issuance/renewal
  ansible.builtin.set_fact:
    needs_cert: >-
      {{
        cert_info is failed or
        cert_info.expired | default(false) or
        ((cert_info.not_after | to_datetime('%Y%m%d%H%M%SZ')) - (ansible_facts['date_time']['iso8601'] | to_datetime('%Y-%m-%dT%H:%M:%SZ'))).days < (cert_min_days | int)
      }}

- name: Debug certificate status
  ansible.builtin.debug:
    msg: "Certificate needs issuance/renewal: {{ needs_cert }}"

- name: Obtain or Renew Let's Encrypt SAN Certificate
  ansible.builtin.command: >
    certbot certonly
    --webroot
    --webroot-path={{ webroot_path }}
    --email {{ admin_email }}
    --agree-tos
    --no-eff-email
    --non-interactive
    --keep-until-expiring
    {% for domain in san_domains %} -d {{ domain }}{% endfor %}
  when: needs_cert | bool
  async: 300  # Hard stop after 5 minutes so CI doesn't hang forever
  poll: 10    # Check status every 10 seconds
  notify: Reload Nginx
