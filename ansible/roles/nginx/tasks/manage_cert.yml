# ansible/roles/nginx/tasks/manage_cert.yml
---
# ---------------------------------------------------------
# CI / DUMMY CERTIFICATE GENERATION
# ---------------------------------------------------------
- name: Generate Dummy Self-Signed Certificate for CI
  block:
    - name: Ensure Let's Encrypt live directory exists for dummy cert
      ansible.builtin.file:
        path: "/etc/letsencrypt/live/{{ main_domain }}"
        state: directory
        mode: '0755'
      become: true

    - name: Generate dummy private key
      community.crypto.openssl_privatekey:
        path: "/etc/letsencrypt/live/{{ main_domain }}/privkey.pem"
        type: RSA
        size: 2048
      become: true

    - name: Generate dummy CSR
      community.crypto.openssl_csr:
        path: "/tmp/dummy.csr"
        privatekey_path: "/etc/letsencrypt/live/{{ main_domain }}/privkey.pem"
        common_name: "{{ main_domain }}"
        subject_alt_name: >-
          {{
            (all_domains | default([main_domain]))
            | map('regex_replace', '^', 'DNS:')
            | list
          }}
      become: true

    - name: Generate dummy self-signed certificate
      community.crypto.x509_certificate:
        path: "/etc/letsencrypt/live/{{ main_domain }}/fullchain.pem"
        privatekey_path: "/etc/letsencrypt/live/{{ main_domain }}/privkey.pem"
        csr_path: "/tmp/dummy.csr"
        provider: selfsigned
      become: true

  when: skip_ssl_provisioning | default(false) | bool

# ---------------------------------------------------------
# PRODUCTION LET'S ENCRYPT (Idempotent)
# ---------------------------------------------------------
- name: Check and Generate Real SAN SSL Certificate
  block:
    # 1. Read the current certificate from disk
    - name: Read existing SSL certificate info
      community.crypto.x509_certificate_info:
        path: "/etc/letsencrypt/live/{{ main_domain }}/fullchain.pem"
      register: cert_info
      ignore_errors: yes

    # 2. Extract the domains currently on the cert
    - name: Extract existing SANs from certificate
      ansible.builtin.set_fact:
        # Strips "DNS:" prefix so we can compare apples-to-apples with all_domains
        existing_sans: >-
          {{
            cert_info.subject_alt_name
            | default([])
            | map('regex_replace', '^DNS:', '')
            | list
          }}
      when: cert_info is succeeded

    # 3. Calculate exactly WHY we might need to run Certbot
    - name: Determine if certificate needs issuance, expansion, or renewal
      ansible.builtin.set_fact:
        # Condition A: Cert doesn't exist or couldn't be read
        cert_missing: "{{ cert_info is failed }}"

        # Condition B: Domains in vars don't match domains on cert
        # symmetric_difference returns items in either list but not both
        domains_changed: >-
          {{
            (existing_sans | default([])) | symmetric_difference(all_domains) | length > 0
          }}

        # Condition C: Cert is expired
        cert_expired: "{{ cert_info.expired | default(false) }}"

        # Condition D: Cert expires in less than cert_min_days
        cert_expiring_soon: >-
          {{
            cert_info is succeeded and
            not (cert_info.expired | default(false)) and
            ((cert_info.not_after | to_datetime('%Y%m%d%H%M%SZ')) - (ansible_facts['date_time']['iso8601'] | to_datetime('%Y-%m-%dT%H:%M:%SZ'))).days < (cert_min_days | int)
          }}

    # 4. Combine into a single boolean
    - name: Set final needs_cert fact
      ansible.builtin.set_fact:
        needs_cert: >-
          {{
            (cert_missing | bool) or
            (domains_changed | bool) or
            (cert_expired | bool) or
            (cert_expiring_soon | bool)
          }}

    # 5. Debugging (Crucial for knowing why it ran or skipped)
    - name: Debug certificate evaluation status
      ansible.builtin.debug:
        msg:
          - "Certificate Missing:   {{ cert_missing }}"
          - "Domains Changed:       {{ domains_changed }}"
          - "Certificate Expired:   {{ cert_expired }}"
          - "Expiring Soon (<{{ cert_min_days }}d): {{ cert_expiring_soon }}"
          - ">>> ACTION: Run Certbot = {{ needs_cert }}"

    # 6. Execute Certbot ONLY if needs_cert is true
    - name: Obtain or Expand Let's Encrypt SAN Certificate
      ansible.builtin.command: >
        certbot certonly --webroot -w {{ webroot_path }}
        --cert-name {{ main_domain }}
        -d {{ all_domains | join(' -d ') }}
        --expand
        --non-interactive --agree-tos --email admin@{{ main_domain }}
      when: needs_cert | bool
      async: 300
      poll: 10
      notify: Reload Nginx

  when: not (skip_ssl_provisioning | default(false) | bool)
