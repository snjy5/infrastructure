# ansible/roles/security/tasks/fail2ban.yml
---
- name: Install Fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
  become: true

- name: Deploy Fail2ban local configuration
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Restart fail2ban

- name: Ensure Fail2ban is started and enabled
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
  become: true
