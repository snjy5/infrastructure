# ansible/roles/security/tasks/updates.yml
---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
  become: true

- name: Configure unattended-upgrades (20auto-upgrades)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    mode: '0644'
  become: true

- name: Configure unattended-upgrades behavior (50unattended-upgrades)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Package-Blacklist {
      };
      Unattended-Upgrade::DevRelease "false";
      Unattended-Upgrade::Mail "{{ security_autoupdate_mail_to }}";
      Unattended-Upgrade::Automatic-Reboot "{{ 'true' if security_autoupdate_reboot else 'false' }}";
      Unattended-Upgrade::Automatic-Reboot-Time "{{ security_autoupdate_reboot_time }}";
    mode: '0644'
  become: true

- name: Ensure unattended-upgrades service is running
  ansible.builtin.systemd:
    name: unattended-upgrades
    state: started
    enabled: true
  become: true
