---
- name: Install WireGuard package
  ansible.builtin.apt:
    name: 
      - wireguard
      - wireguard-tools
    state: present
    update_cache: yes

- name: Ensure WireGuard configuration directory exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Deploy WireGuard configuration from template
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: '0600'
  notify: Restart WireGuard

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: yes

- name: Check if WireGuard private key already exists
  ansible.builtin.stat:
    path: /etc/wireguard/privatekey
  register: private_key_stat

- name: Generate WireGuard private key if it does not exist
  ansible.builtin.command:
    cmd: wg genkey > /etc/wireguard/privatekey
    creates: /etc/wireguard/privatekey
  when: not private_key_stat.stat.exists

- name: Set secure permissions on the private key
  ansible.builtin.file:
    path: /etc/wireguard/privatekey
    owner: root
    group: root
    mode: '0600'

- name: Read the server's private key
  ansible.builtin.slurp:
    src: /etc/wireguard/privatekey
  register: private_key_file

- name: Generate and read the server's public key
  ansible.builtin.command:
    cmd: wg pubkey
    stdin: "{{ private_key_file['content'] | b64decode }}"
  register: public_key_file
  changed_when: false

- name: Store server public key as a fact
  ansible.builtin.set_fact:
    wireguard_public_key: "{{ public_key_file.stdout }}"

