---
- name: Install WireGuard packages
  ansible.builtin.apt:
    name: 
      - wireguard
      - wireguard-tools
    state: present
    update_cache: yes

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: yes

- name: Ensure WireGuard configuration directory exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Generate WireGuard private key
  ansible.builtin.shell: wg genkey > /etc/wireguard/private.key
  args:
    creates: /etc/wireguard/private.key

- name: Set secure permissions on the private key
  ansible.builtin.file:
    path: /etc/wireguard/private.key
    owner: root
    group: root
    mode: '0600'

- name: Read private key into variable
  ansible.builtin.command: cat /etc/wireguard/private.key
  register: wg_private_key_result
  changed_when: false

- name: Deploy WireGuard configuration from template
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: '0600'
  notify: Restart WireGuard

- name: Verify WireGuard interface link is UP
  ansible.builtin.command: ip link show wg0
  register: wg_interface_status
  changed_when: false

- name: Ping the internal WireGuard tunnel IP
  ansible.builtin.command: ping -c 3 10.0.1.1
  register: wg_ping_status
  changed_when: false

- name: Fetch active WireGuard runtime status
  ansible.builtin.command: wg show
  register: wg_show_output
  changed_when: false

- name: Debug and print the final WireGuard state to CI Logs
  ansible.builtin.debug:
    var: wg_show_output.stdout_lines
