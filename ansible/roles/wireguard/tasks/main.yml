---
- name: Install WireGuard packages
  ansible.builtin.apt:
    name: 
      - wireguard
      - wireguard-tools
    state: present
    update_cache: yes

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: yes

- name: Ensure WireGuard configuration directory exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Generate WireGuard private key
  ansible.builtin.shell: wg genkey > /etc/wireguard/private.key
  args:
    creates: /etc/wireguard/private.key

- name: Set secure permissions on the private key
  ansible.builtin.file:
    path: /etc/wireguard/private.key
    owner: root
    group: root
    mode: '0600'

- name: Read private key into variable
  ansible.builtin.command: cat /etc/wireguard/private.key
  register: wg_private_key_result
  changed_when: false

- name: Deploy WireGuard configuration from template
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: '0600'
  notify: Restart WireGuard
