---
- name: Install WireGuard package
  ansible.builtin.apt:
    name: 
      - wireguard
      - wireguard-tools
    state: present
    update_cache: yes

- name: Ensure WireGuard configuration directory exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Deploy WireGuard configuration from template
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: '0600'
  notify: Restart WireGuard
